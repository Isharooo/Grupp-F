# Database Configuration
spring.datasource.url=jdbc:mariadb://mariadb:3306/grfood
spring.datasource.username=grfood
spring.datasource.password=grfoodpassword
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Server Configuration
server.port=8081

# Keycloak Configuration
keycloak.auth-server-url=http://keycloak:8080
keycloak.realm=grfood-realm
keycloak.client-id=grfood-backend
keycloak.client-secret=gKUGXYVrehQTCGcQMnqHXSb1FWF34KBp

# OAuth2 Resource Server Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/grfood-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/grfood-realm/protocol/openid-connect/certs

# CORS Configuration
management.endpoints.web.exposure.include=health,info

# Application name
spring.application.name=Backend

# Debug logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.com.groupf.Backend=DEBUG
logging.level.org.springframework.boot.autoconfigure=DEBUG

# Actuator endpoints
management.endpoint.health.show-details=always
management.health.defaults.enabled=true